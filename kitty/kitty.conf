# ── Font ──────────────────────────────────────────────────────────
font_family      family='JetBrains Mono' postscript_name=JetBrainsMono-Regular
bold_font        family='JetBrains Mono' variable_name=JetBrainsMono wght=700
italic_font      family='JetBrains Mono' postscript_name=JetBrainsMono-Italic
bold_italic_font family='JetBrains Mono' postscript_name=JetBrainsMono-BoldItalic
font_size 13.0
disable_ligatures never

# ── Cursor ───────────────────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0

# ── Scrollback ───────────────────────────────────────────────────
scrollback_lines 10000

# ── Mouse ────────────────────────────────────────────────────────
mouse_hide_wait  3.0
url_style        curly
copy_on_select   clipboard

# ── Window ───────────────────────────────────────────────────────
remember_window_size   yes
window_padding_width   8
placement_strategy     center
enabled_layouts        splits,stack
confirm_os_window_close 0

# ── Tab Bar ──────────────────────────────────────────────────────
tab_bar_min_tabs        1
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      " {index}: {title}{' ({num_windows})' if num_windows > 1 else ''} "
active_tab_font_style   bold
inactive_tab_font_style normal

# ── Audio ────────────────────────────────────────────────────────
enable_audio_bell no

# ── macOS ────────────────────────────────────────────────────────
macos_option_as_alt         yes
macos_quit_when_last_window_closed yes
macos_titlebar_color        background

# ── Keybindings: Tabs ────────────────────────────────────────────
map cmd+t       new_tab_with_cwd
map cmd+w       close_tab
map cmd+1       goto_tab 1
map cmd+2       goto_tab 2
map cmd+3       goto_tab 3
map cmd+4       goto_tab 4
map cmd+5       goto_tab 5
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab

# ── Keybindings: Splits ─────────────────────────────────────────
map cmd+enter    launch --location=vsplit --cwd=current
map cmd+shift+w  close_window

# Move splits
map cmd+left     move_window left
map cmd+right    move_window right
map cmd+up       move_window up
map cmd+down     move_window down

# Navigate splits
map cmd+shift+h  neighboring_window left
map cmd+shift+l  neighboring_window right
map cmd+shift+k  neighboring_window up
map cmd+shift+j  neighboring_window down

# ── Keybindings: Misc ───────────────────────────────────────────
map cmd+equal    change_font_size all +1.0
map cmd+minus    change_font_size all -1.0
map cmd+0        change_font_size all 0

