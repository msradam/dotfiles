# Catppuccin Mocha — dark palette.
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$c\
$cmd_duration\
$line_break\
$character"""

palette = "catppuccin_mocha"

[directory]
style = "iris bold"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "iris"
format = ' [on](subtle) [$symbol$branch]($style)'

[git_status]
style = "gold"
format = ' [$all_status$ahead_behind]($style)'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "≠"
untracked = "?"
stashed = "≡"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[python]
symbol = " "
style = "gold"
format = ' [$symbol$version]($style)'

[nodejs]
symbol = " "
style = "foam"
format = ' [$symbol$version]($style)'

[rust]
symbol = " "
style = "love"
format = ' [$symbol$version]($style)'

[golang]
symbol = " "
style = "pine"
format = ' [$symbol$version]($style)'

[c]
symbol = " "
style = "foam"
format = ' [$symbol$version]($style)'

[cmd_duration]
min_time = 2_000
style = "subtle"
format = ' [· $duration]($style)'

[character]
success_symbol = "[❯](iris)"
error_symbol = "[❯](love)"
vimcmd_symbol = "[❮](foam)"

[palettes.catppuccin_mocha]
base           = "#1e1e2e"
surface        = "#313244"
overlay        = "#45475a"
muted          = "#6c7086"
subtle         = "#9399b2"
text           = "#cdd6f4"
love           = "#f38ba8"
gold           = "#f9e2af"
rose           = "#f5e0dc"
pine           = "#a6e3a1"
foam           = "#94e2d5"
iris           = "#cba6f7"
highlight_low  = "#181825"
highlight_med  = "#45475a"
highlight_high = "#585b70"
