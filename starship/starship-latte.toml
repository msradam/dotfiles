# Catppuccin Latte — light palette.
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$c\
$cmd_duration\
$line_break\
$character"""

palette = "catppuccin_latte"

[directory]
style = "pine bold"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "iris"
format = ' [on](subtle) [$symbol$branch]($style)'

[git_status]
style = "gold"
format = ' [$all_status$ahead_behind]($style)'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "≠"
untracked = "?"
stashed = "≡"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[python]
symbol = " "
style = "gold"
format = ' [$symbol$version]($style)'

[nodejs]
symbol = " "
style = "foam"
format = ' [$symbol$version]($style)'

[rust]
symbol = " "
style = "love"
format = ' [$symbol$version]($style)'

[golang]
symbol = " "
style = "pine"
format = ' [$symbol$version]($style)'

[c]
symbol = " "
style = "pine"
format = ' [$symbol$version]($style)'

[cmd_duration]
min_time = 2_000
style = "subtle"
format = ' [· $duration]($style)'

[character]
success_symbol = "[❯](iris)"
error_symbol = "[❯](love)"
vimcmd_symbol = "[❮](foam)"

[palettes.catppuccin_latte]
base           = "#eff1f5"
surface        = "#ccd0da"
overlay        = "#bcc0cc"
muted          = "#9ca0b0"
subtle         = "#6c6f85"
text           = "#4c4f69"
love           = "#d20f39"
gold           = "#df8e1d"
rose           = "#dc8a78"
pine           = "#40a02b"
foam           = "#179299"
iris           = "#8839ef"
highlight_low  = "#e6e9ef"
highlight_med  = "#bcc0cc"
highlight_high = "#acb0be"
