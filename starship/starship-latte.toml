# Catppuccin Latte variant — darker palette tuned for light terminals.
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$c\
$cmd_duration\
$line_break\
$character"""

palette = "catppuccin_latte"

[directory]
style = "blue bold"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "mauve"
format = ' [on](subtext1) [$symbol$branch]($style)'

[git_status]
style = "peach"
format = ' [$all_status$ahead_behind]($style)'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "≠"
untracked = "?"
stashed = "≡"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[python]
symbol = " "
style = "yellow"
format = ' [$symbol$version]($style)'

[nodejs]
symbol = " "
style = "green"
format = ' [$symbol$version]($style)'

[rust]
symbol = " "
style = "red"
format = ' [$symbol$version]($style)'

[golang]
symbol = " "
style = "sapphire"
format = ' [$symbol$version]($style)'

[c]
symbol = " "
style = "blue"
format = ' [$symbol$version]($style)'

[cmd_duration]
min_time = 2_000
style = "subtext1"
format = ' [· $duration]($style)'

[character]
success_symbol = "[❯](mauve)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[palettes.catppuccin_latte]
rosewater = "#dc8a78"
flamingo  = "#dd7878"
pink      = "#ea76cb"
mauve     = "#8839ef"
red       = "#d20f39"
maroon    = "#e64553"
peach     = "#fe640b"
yellow    = "#df8e1d"
green     = "#40a02b"
teal      = "#179299"
sky       = "#04a5e5"
sapphire  = "#209fb5"
blue      = "#1e66f5"
lavender  = "#7287fd"
text      = "#4c4f69"
subtext1  = "#5c5f77"
subtext0  = "#6c6f85"
overlay2  = "#7c7f93"
overlay1  = "#8c8fa1"
overlay0  = "#9ca0b0"
surface2  = "#acb0be"
surface1  = "#bcc0cc"
surface0  = "#ccd0da"
base      = "#eff1f5"
mantle    = "#e6e9ef"
crust     = "#dce0e8"
