# Minimal Catppuccin Mocha prompt — colors only, no powerline boxes.
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$c\
$cmd_duration\
$line_break\
$character"""

palette = "catppuccin_mocha"

[directory]
style = "lavender bold"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "mauve"
format = ' [on](subtext0) [$symbol$branch]($style)'

[git_status]
style = "peach"
format = ' [$all_status$ahead_behind]($style)'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "≠"
untracked = "?"
stashed = "≡"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[python]
symbol = " "
style = "yellow"
format = ' [$symbol$version]($style)'

[nodejs]
symbol = " "
style = "green"
format = ' [$symbol$version]($style)'

[rust]
symbol = " "
style = "red"
format = ' [$symbol$version]($style)'

[golang]
symbol = " "
style = "sky"
format = ' [$symbol$version]($style)'

[c]
symbol = " "
style = "blue"
format = ' [$symbol$version]($style)'

[cmd_duration]
min_time = 2_000
style = "subtext0"
format = ' [· $duration]($style)'

[character]
success_symbol = "[❯](mauve)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"
