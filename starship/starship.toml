format = """
[](lavender)\
$os\
[](bg:blue fg:lavender)\
$directory\
[](fg:blue bg:sky)\
$git_branch\
$git_status\
[](fg:sky bg:teal)\
$python\
$nodejs\
$rust\
$golang\
$c\
[](fg:teal bg:surface0)\
$cmd_duration\
[](fg:surface0)\
$line_break\
$character"""

palette = "catppuccin_mocha"

[os]
disabled = false
style = "bg:lavender fg:crust"

[os.symbols]
Macos = " "

[directory]
style = "bg:blue fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bg:sky fg:crust"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:sky fg:crust"
format = '[$all_status$ahead_behind ]($style)'

[python]
symbol = " "
style = "bg:teal fg:crust"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:teal fg:crust"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = " "
style = "bg:teal fg:crust"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = " "
style = "bg:teal fg:crust"
format = '[ $symbol ($version) ]($style)'

[c]
symbol = " "
style = "bg:teal fg:crust"
format = '[ $symbol ($version) ]($style)'

[cmd_duration]
min_time = 2_000
style = "bg:surface0 fg:text"
format = '[ 󰔟 $duration ]($style)'

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"
